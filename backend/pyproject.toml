[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.1",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.143.2",
    "itsdangerous>=2.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["I", "E", "F"]
ignore = ["I001", "E501", "F401"]
